# 开发/本地构建用 Docker Compose 文件。
# 默认模式：Next.js 由宿主机 VS Code F5/pnpm dev 启动；Compose 只启动数据库、媒体服务和通用 Worker。
# 默认从当前 build 目录读取 .env；从仓库根目录运行时请显式传入 --env-file build/.env。
# app 和 scheduler 受 profile 控制，不会被普通的
# docker compose -f docker-compose.dev.yml up 自动启动。

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15
    container_name: pixishelf-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pixishelf-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # 可选：容器化运行 Next.js 应用。默认开发模式下不启动，通常直接在宿主机 pnpm dev。
  app:
    profiles:
      - container-app
    build:
      context: ..
      dockerfile: build/Dockerfile
      target: production
    container_name: pixishelf-app
    ports:
      - '${PIXISHELF_HOST_PORT:-5430}:5430' # Web 服务端口
      - '${PRISMA_STUDIO_HOST_PORT:-5555}:5555' # Prisma Studio 端口
    env_file:
      - .env
    environment:
      # API 环境变量
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=20&pool_timeout=20
      SCAN_PATH: /app/data
      ARCHIVE_STORAGE_PATH: /app/data
      PIXIV_DATA_STORAGE_PATH: /app/pixiv-data
      NEXT_PUBLIC_IMGPROXY_URL: http://127.0.0.1:${IMGPROXY_HOST_PORT:-5431}
    volumes:
      - '${PIXISHELF_DATA_PATH}:/app/data:cached'
      - '${PIXISHELF_PUBLIC_DATA_PATH:?PIXISHELF_PUBLIC_DATA_PATH is required}:/app/pixiv-data:ro'
      - '${DERIVED_MEDIA_HOST_PATH:-../packages/pixishelf/.local-data/derived-media}:/app/.local-data/derived-media'
    networks:
      - pixishelf-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # 通用后台 Worker。开发环境与最终生产架构一致，固定单实例消费中央队列。
  # 是否领取任务由 build/.env 中的 WORKER_DISPATCH_ENABLED 控制。
  worker:
    build:
      context: ..
      dockerfile: build/worker.Dockerfile
      target: production
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=5&pool_timeout=20
      WORKER_SERVICE_VERSION: ${IMAGE_TAG:-dev}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3011
      ARCHIVE_STORAGE_PATH: /app/data
      SCAN_PATH: /app/data
      SCAN_DISCOVERY_MAX_ENTRIES: ${SCAN_DISCOVERY_MAX_ENTRIES:-10000000}
      SCAN_DISCOVERY_EXCLUDED_ROOT_DIRECTORIES: ${SCAN_DISCOVERY_EXCLUDED_ROOT_DIRECTORIES-local-imports,sources,.archive-staging,.trash}
      DERIVED_MEDIA_STORAGE_PATH: /app/.local-data/derived-media
      PIXIV_DATA_ROOT: /app/pixiv-data
      KEYFRAME_FFMPEG_THREADS: ${KEYFRAME_FFMPEG_THREADS:-2}
      ARCHIVE_MAX_MEDIA_BYTES: ${ARCHIVE_MAX_MEDIA_BYTES:-536870912}
      WORKER_DISPATCH_ENABLED: ${WORKER_DISPATCH_ENABLED:-false}
      WORKER_DISPATCH_POLL_INTERVAL_MS: ${WORKER_DISPATCH_POLL_INTERVAL_MS:-1000}
      WORKER_JOB_LEASE_DURATION_MS: ${WORKER_JOB_LEASE_DURATION_MS:-60000}
      WORKER_JOB_HEARTBEAT_INTERVAL_MS: ${WORKER_JOB_HEARTBEAT_INTERVAL_MS:-20000}
      WORKER_QUEUE_TRANSACTION_MAX_WAIT_MS: ${WORKER_QUEUE_TRANSACTION_MAX_WAIT_MS:-5000}
      WORKER_QUEUE_TRANSACTION_TIMEOUT_MS: ${WORKER_QUEUE_TRANSACTION_TIMEOUT_MS:-30000}
      WORKER_DISPATCH_DRAIN_GRACE_MS: ${WORKER_DISPATCH_DRAIN_GRACE_MS:-30000}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_PREFLIGHT_TIMEOUT_MS: ${WORKER_PREFLIGHT_TIMEOUT_MS:-10000}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
    volumes:
      - '${PIXISHELF_DATA_PATH}:/app/data:rw'
      - '${PIXISHELF_PUBLIC_DATA_PATH:?PIXISHELF_PUBLIC_DATA_PATH is required}:/app/pixiv-data:rw'
      - '${DERIVED_MEDIA_HOST_PATH:-../packages/pixishelf/.local-data/derived-media}:/app/.local-data/derived-media:rw'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixishelf-network
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  scheduler:
    profiles:
      - scheduled
    image: curlimages/curl:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PIXISHELF_INTERNAL_URL: ${PIXISHELF_INTERNAL_URL:-http://host.docker.internal:5430}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
    command: >
      sh -c 'while true; do
        curl -fsS -X POST -H "Authorization: Bearer $${INTERNAL_JOB_TOKEN}" "$${PIXISHELF_INTERNAL_URL}/api/internal/scheduler/tick" || true;
        sleep "$${SCHEDULER_TICK_SECONDS}";
      done'
    networks:
      - pixishelf-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # imgproxy 服务容器
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    ports:
      - '${IMGPROXY_HOST_PORT:-5431}:5431' # 将 ImgProxy 的 8080 端口映射到宿主机
    volumes:
      # 关键：将存储原图的文件夹挂载到 ImgProxy 容器中
      - '${PIXISHELF_DATA_PATH}:/mnt/pixishelf/media:ro'
      - '${DERIVED_MEDIA_HOST_PATH:-../packages/pixishelf/.local-data/derived-media}:/mnt/pixishelf/derived-media:ro'
    environment:
      - IMGPROXY_BIND=:5431
      # 允许 ImgProxy 处理来自本地文件系统的图片
      - IMGPROXY_USE_FILESYSTEM=true
      # 不使用镜像内置的 /data 挂载点，避免在只读卷下创建子挂载。
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/mnt/pixishelf
      - IMGPROXY_ALLOWED_SOURCES=local:///media/,local:///derived-media/
      - IMGPROXY_ENABLE_VIDEO_THUMBNAILS=true
      - IMGPROXY_MAX_SRC_FILE_SIZE=0
      - IMGPROXY_MAX_SRC_RESOLUTION=1000
    networks:
      - pixishelf-network
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  postgres_data:

networks:
  pixishelf-network:
    driver: bridge
