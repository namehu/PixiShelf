name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*' # 触发条件：推送版本标签
  workflow_dispatch: # 手动触发

env:
  REGISTRY_GITHUB: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: pixishelf
  WORKER_IMAGE_NAME: pixishelf-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pixishelf:pixishelf@127.0.0.1:5432/pixishelf
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pixishelf
          POSTGRES_PASSWORD: pixishelf
          POSTGRES_DB: pixishelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixishelf -d pixishelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate Prisma Client
        run: |
          pnpm --filter @pixishelf/db db:generate
          pnpm --filter @pixishelf/db db:validate

      - name: Deploy and verify the complete PostgreSQL migration chain
        run: |
          pnpm --filter @pixishelf/db db:deploy
          pnpm --filter @pixishelf/db exec prisma migrate status --schema prisma/schema.prisma

      - name: Typecheck Worker packages
        run: pnpm --filter @pixishelf/worker... typecheck

      - name: Test database and Worker packages
        run: pnpm --filter @pixishelf/worker... test

      - name: Build shared packages and standalone Worker
        run: |
          pnpm --filter @pixishelf/job-contracts build
          pnpm --filter @pixishelf/job-runtime build
          pnpm --filter @pixishelf/job-executors build
          pnpm --filter @pixishelf/worker build

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the existing build cache is exported before validation succeeds.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pixishelf
            dockerfile: ./build/Dockerfile
          - image: pixishelf-worker
            dockerfile: ./build/worker.Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry for cache
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Prepare archive directory
        run: mkdir -p "${{ runner.temp }}/release-image"

      - name: Build OCI image and export cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: false
          provenance: mode=min
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:5431' }}
            APP_VERSION=${{ github.ref_name }}
          # One local reference keeps the OCI archive unambiguous for skopeo.
          tags: local/${{ matrix.image }}:build
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/release-image/image.tar
          cache-from: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ matrix.image }}:cache,mode=max
          platforms: linux/amd64

      - name: Record publication tags and archive checksum
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        working-directory: ${{ runner.temp }}/release-image
        run: |
          printf '%s\n' "$IMAGE_TAGS" > tags.txt
          sha256sum image.tar tags.txt > SHA256SUMS
          printf '### %s archive\n\n' '${{ matrix.image }}' >> "$GITHUB_STEP_SUMMARY"
          du -h image.tar >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.image }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          # A full rerun replaces this image; failed-job reruns can reuse its peer.
          overwrite: true

  build-and-push:
    name: Publish ${{ matrix.image }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [pixishelf, pixishelf-worker]
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: release-image-${{ matrix.image }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-image

      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/release-image
        run: sha256sum --check SHA256SUMS

      - name: Install image copy tool
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y skopeo
          fi
          skopeo --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish existing image without rebuilding
        working-directory: ${{ runner.temp }}/release-image
        shell: bash
        run: |
          test -s tags.txt
          while IFS= read -r image_tag; do
            test -n "$image_tag"
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              oci-archive:image.tar "docker://$image_tag"
          done < tags.txt

  # 两个镜像均发布成功后创建 Release
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/docker-compose.deploy.yml
            build/.env.example
            build/init.sql
            DEPLOYMENT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 安全扫描作业
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner for PixiShelf Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-web-results.sarif'

      - name: Upload PixiShelf Web scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'pixishelf-web'

      - name: Run Trivy vulnerability scanner for worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-worker-results.sarif'

      - name: Upload worker scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-worker-results.sarif'
          category: 'pixishelf-worker'

  timings:
    name: Release timings
    needs: [validate, build, build-and-push, create-release, security-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Summarize job and step durations
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              per_page: 100,
            });
            const seconds = (start, end) => start && end
              ? String(Math.max(0, Math.round((Date.parse(end) - Date.parse(start)) / 1000)))
              : '—';
            const completed = jobs.filter(job => job.completed_at);
            const starts = completed.map(job => Date.parse(job.started_at));
            const ends = completed.map(job => Date.parse(job.completed_at));
            core.summary.addHeading('Release timings');
            core.summary.addRaw('Durations overlap across parallel jobs; do not add them to estimate elapsed time. This report covers the current attempt.\n\n');
            if (completed.length) {
              core.summary.addRaw(`Observed job span (excluding this report): ${Math.round((Math.max(...ends) - Math.min(...starts)) / 1000)} s\n\n`);
            }
            core.summary.addTable([
              [{data: 'Job', header: true}, {data: 'Result', header: true}, {data: 'Seconds', header: true}],
              ...completed.map(job => [job.name, job.conclusion ?? 'unknown', seconds(job.started_at, job.completed_at)]),
            ]);
            for (const job of completed) {
              core.summary.addHeading(job.name, 3).addTable([
                [{data: 'Step', header: true}, {data: 'Result', header: true}, {data: 'Seconds', header: true}],
                ...(job.steps ?? []).map(step => [step.name, step.conclusion ?? step.status, seconds(step.started_at, step.completed_at)]),
              ]);
            }
            await core.summary.write();
