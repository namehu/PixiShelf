name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*' # 触发条件：推送版本标签
  workflow_dispatch: # 手动触发

env:
  REGISTRY_GITHUB: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: pixishelf
  WORKER_IMAGE_NAME: pixishelf-archive-worker
  NEXT_WORKER_IMAGE_NAME: pixishelf-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pixishelf:pixishelf@127.0.0.1:5432/pixishelf
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pixishelf
          POSTGRES_PASSWORD: pixishelf
          POSTGRES_DB: pixishelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixishelf -d pixishelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Verify database migrations and Worker release boundary
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pixishelf/db db:generate
          pnpm --filter @pixishelf/db db:validate
          pnpm --filter @pixishelf/db db:deploy
          pnpm --filter @pixishelf/db exec prisma migrate status --schema prisma/schema.prisma
          pnpm --filter @pixishelf/worker... typecheck
          pnpm --filter @pixishelf/worker... test
          pnpm --filter @pixishelf/worker... build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for PixiShelf
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push PixiShelf Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:5431' }}
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:cache,mode=max
          platforms: linux/amd64

      - name: Extract metadata for PixiShelf archive worker
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push PixiShelf archive worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/archive-worker.Dockerfile
          target: production
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE_NAME }}:cache,mode=max
          platforms: linux/amd64

      - name: Extract metadata for PixiShelf general worker preview
        id: next-worker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.NEXT_WORKER_IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.NEXT_WORKER_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push PixiShelf general worker preview image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/worker.Dockerfile
          target: production
          push: true
          tags: ${{ steps.next-worker-meta.outputs.tags }}
          labels: ${{ steps.next-worker-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.NEXT_WORKER_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.NEXT_WORKER_IMAGE_NAME }}:cache,mode=max
          platforms: linux/amd64

  # 创建 GitHub Release (只在第一个job完成后执行)
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            build/docker-compose.deploy.yml
            build/.env.example
            build/init.sql
            DEPLOYMENT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 安全扫描作业
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner for PixiShelf Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-web-results.sarif'

      - name: Upload PixiShelf Web scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'pixishelf-web'

      - name: Run Trivy vulnerability scanner for archive worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-worker-results.sarif'

      - name: Upload archive worker scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-worker-results.sarif'
          category: 'pixishelf-archive-worker'

      - name: Run Trivy vulnerability scanner for general worker preview
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_GITHUB }}/${{ github.repository_owner }}/${{ env.NEXT_WORKER_IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-next-worker-results.sarif'

      - name: Upload general worker preview scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-next-worker-results.sarif'
          category: 'pixishelf-worker-preview'
