<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>检查重复 · PixiShelf 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff;
        --foreground: #333;
        --primary: #006fbe;
        --primary-foreground: #fff;
        --muted: #f4f7f9;
        --muted-foreground: #66727d;
        --accent: #edf8ff;
        --border: #e4e9ed;
        --input: #d4dce2;
        --ring: #0096fa;
        --destructive: #c8323c;
        --destructive-foreground: #fff;
        --success: #167a55;
        --warning: #956100;
        --surface-muted: #f7fbfe;
        --font:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei',
          sans-serif;
        --safe: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #252525;
        --foreground: #fafafa;
        --primary: #4eb6ee;
        --primary-foreground: #102e3e;
        --muted: #263b48;
        --muted-foreground: #b3b3b5;
        --accent: #294d65;
        --border: #354b5b;
        --input: #4d677b;
        --ring: #4eb6ee;
        --destructive: #ff7680;
        --destructive-foreground: #202020;
        --success: #59bd92;
        --warning: #eeb95a;
        --surface-muted: #243848;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select,
      summary,
      label {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }
      button {
        border: 0;
      }
      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }
      ::selection {
        background: var(--accent);
        color: var(--foreground);
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      input {
        accent-color: var(--primary);
        caret-color: var(--primary);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 32px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 620;
      }
      h3 {
        font-size: 15px;
        line-height: 22px;
        font-weight: 620;
      }
      svg.icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .btn {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 15px;
        border-radius: 10px;
        background: transparent;
        color: var(--foreground);
        font-weight: 550;
        white-space: nowrap;
        text-decoration: none;
      }
      .btn:hover:not(:disabled) {
        background: var(--muted);
      }
      .btn.primary {
        color: var(--primary-foreground);
        background: var(--primary);
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(0.96);
        background: var(--primary);
      }
      .btn.outline {
        border: 1px solid var(--input);
      }
      .btn.link {
        color: var(--primary);
      }
      .btn.danger {
        color: var(--destructive);
      }
      .btn.destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
      }
      .btn.icon-only {
        width: 44px;
        padding: 10px;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .success {
        color: var(--success);
      }
      .warning {
        color: var(--warning);
      }
      .danger-text {
        color: var(--destructive);
      }
      .small {
        font-size: 12px;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .nowrap {
        white-space: nowrap;
      }
      .prototype-toolbar {
        background: var(--muted);
        border-bottom: 1px solid var(--border);
        padding: 8px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .prototype-toolbar strong {
        font-weight: 600;
        color: var(--foreground);
      }
      .prototype-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .prototype-controls select {
        min-height: 44px;
        border: 1px solid var(--input);
        border-radius: 10px;
        background: var(--background);
        color: var(--foreground);
        padding: 8px 30px 8px 10px;
        min-width: 112px;
      }
      .app-nav {
        padding: 0 32px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand svg {
        color: var(--primary);
      }
      .nav-items {
        display: flex;
        gap: 24px;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .nav-items .active {
        color: var(--foreground);
        font-weight: 600;
      }
      main {
        max-width: 1104px;
        margin: 0 auto;
        padding: 24px 32px 140px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
        margin-left: -8px;
        padding: 8px;
        background: transparent;
        color: var(--muted-foreground);
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        padding: 8px 0 24px;
      }
      .page-actions {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .head-copy {
        margin-top: 5px;
        color: var(--muted-foreground);
      }
      .menu-wrap {
        position: relative;
      }
      .menu-wrap summary {
        list-style: none;
      }
      .menu-wrap summary::-webkit-details-marker {
        display: none;
      }
      .menu {
        position: absolute;
        right: 0;
        z-index: 12;
        top: 48px;
        width: 218px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--background);
      }
      .menu button {
        width: 100%;
        justify-content: start;
      }
      .menu small {
        display: block;
        padding: 0 10px 10px;
        color: var(--muted-foreground);
      }
      .tabs {
        display: flex;
        gap: 28px;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted-foreground);
        background: transparent;
        min-height: 48px;
        padding: 8px 0 13px;
        border-bottom: 2px solid transparent;
        font-weight: 550;
      }
      .tab[aria-selected='true'] {
        color: var(--primary);
        border-color: var(--primary);
      }
      .tab-count {
        font-size: 12px;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
      }
      .results-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 22px 0 10px;
      }
      .results-toolbar p {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .group {
        border-bottom: 1px solid var(--border);
        padding: 14px 0 20px;
      }
      .group.selected {
        background: var(--surface-muted);
        border-radius: 12px;
        padding-left: 14px;
        padding-right: 14px;
        margin-left: -14px;
        margin-right: -14px;
      }
      .group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
      }
      .group-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .group-title h2 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .group-head-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .select-label,
      .keep-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        cursor: pointer;
      }
      .select-label input,
      .keep-label input {
        width: 18px;
        height: 18px;
        margin: 0;
        cursor: inherit;
      }
      .select-label:has(input:disabled) {
        cursor: not-allowed;
      }
      .select-label:has(input:disabled) input {
        opacity: 0.5;
      }
      .group-note {
        margin: 0 0 8px 52px;
        font-size: 12px;
        color: var(--warning);
      }
      .members {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .member {
        display: grid;
        grid-template-columns: 44px 44px minmax(0, 1fr) 150px;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        min-height: 76px;
      }
      .cover {
        width: 44px;
        height: 56px;
        border-radius: 5px;
        overflow: hidden;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: #dae6ee;
        color: #406884;
        position: relative;
      }
      .cover::before {
        content: '';
        width: 20px;
        height: 32px;
        border: 1px solid currentColor;
        opacity: 0.5;
        transform: rotate(-10deg);
        position: absolute;
      }
      .cover span {
        position: relative;
        font-size: 11px;
        font-weight: 700;
        background: inherit;
        padding: 2px;
      }
      .cover.summer {
        background: #e9e5d4;
        color: #706b39;
      }
      .cover.train {
        background: #dce4de;
        color: #4d6855;
      }
      .member-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 550;
      }
      .member-meta {
        color: var(--muted-foreground);
        font-size: 12px;
        margin-top: 4px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px 12px;
      }
      .member-status {
        justify-self: end;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .keep-status {
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .keep-status svg {
        width: 16px;
        height: 16px;
      }
      .member-more {
        display: flex;
        justify-content: end;
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: end;
        gap: 8px;
        margin-top: 24px;
      }
      .pagination span {
        padding: 0 10px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .selection-bar {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: min(calc(100% - 48px), 760px);
        padding: 12px 16px;
        border-radius: 16px;
        background: var(--background);
        box-shadow:
          0 12px 32px rgb(31 41 55/0.16),
          0 2px 8px rgb(31 41 55/0.08);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
      }
      .selection-bar-actions {
        display: flex;
        gap: 6px;
      }
      .selection-bar p {
        font-weight: 550;
      }
      .selection-bar .small {
        margin-top: 2px;
        font-weight: 400;
      }
      .notice {
        display: flex;
        align-items: start;
        gap: 12px;
        padding: 18px 0;
        border-bottom: 1px solid var(--border);
      }
      .notice-body {
        flex: 1;
        min-width: 0;
      }
      .notice-body p {
        margin-top: 3px;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .notice .icon {
        margin-top: 2px;
      }
      .notice-actions {
        display: flex;
        gap: 4px;
      }
      .notice details {
        margin-top: 8px;
      }
      .notice summary {
        cursor: pointer;
        color: var(--primary);
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .notice pre {
        font:
          12px/1.7 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--muted);
        padding: 12px;
        border-radius: 8px;
      }
      .progress-track {
        height: 3px;
        background: var(--border);
        margin-top: 16px;
        overflow: hidden;
        border-radius: 2px;
      }
      .progress-track span {
        display: block;
        width: 32%;
        height: 100%;
        background: var(--primary);
      }
      .empty-state {
        min-height: 310px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
        gap: 8px;
      }
      .empty-state .empty-icon {
        color: var(--muted-foreground);
        margin-bottom: 10px;
      }
      .empty-state .empty-icon svg {
        width: 36px;
        height: 36px;
        stroke-width: 1.3;
      }
      .empty-state p {
        color: var(--muted-foreground);
      }
      .empty-state .btn {
        margin-top: 12px;
      }
      .skeleton-group {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .skeleton {
        height: 16px;
        width: 42%;
        background: var(--muted);
        border-radius: 5px;
      }
      .skeleton-line {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 16px 0 0 52px;
      }
      .skeleton-cover {
        height: 56px;
        width: 44px;
        background: var(--muted);
        border-radius: 5px;
      }
      .skeleton-line .skeleton {
        width: 56%;
      }
      .isolation-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .batch-title {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .batch-title .icon {
        color: var(--muted-foreground);
      }
      .batch-meta {
        padding-left: 30px;
        color: var(--muted-foreground);
        margin-top: 6px;
        font-size: 12px;
      }
      .batch-actions {
        display: flex;
        gap: 4px;
      }
      .batch-status {
        color: var(--success);
        font-size: 12px;
        margin-left: 6px;
      }
      .mobile-nav {
        display: none;
      }
      dialog {
        inset: 0 0 0 auto;
        margin: 0;
        border: 0;
        padding: 0;
        height: 100dvh;
        max-height: 100dvh;
        width: 500px;
        max-width: 100%;
        background: var(--background);
        color: var(--foreground);
        overflow: hidden;
        box-shadow: -8px 0 40px rgb(0 0 0/0.12);
      }
      dialog::backdrop {
        background: rgb(0 0 0/0.25);
      }
      .sheet {
        display: flex;
        height: 100%;
        flex-direction: column;
      }
      .sheet-header {
        padding: 24px 24px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
        flex-shrink: 0;
      }
      .sheet-header h2 {
        font-size: 20px;
        line-height: 28px;
        padding-top: 7px;
      }
      .sheet-header p {
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 6px;
      }
      .sheet-content {
        overflow-y: auto;
        padding: 24px;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: var(--input) var(--background);
      }
      .sheet-footer {
        border-top: 1px solid var(--border);
        padding: 16px 24px calc(16px + var(--safe));
        display: flex;
        justify-content: end;
        gap: 8px;
        flex-shrink: 0;
      }
      .sheet-section + .sheet-section {
        margin-top: 28px;
      }
      .sheet-section h3 {
        margin-bottom: 12px;
      }
      .sheet .member {
        grid-template-columns: 44px 44px minmax(0, 1fr);
        gap: 10px;
      }
      .sheet .member-status {
        grid-column: 3;
        justify-self: start;
        margin-top: -8px;
      }
      .sheet .pagination {
        justify-content: center;
      }
      .sheet-copy {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .definition {
        display: grid;
        grid-template-columns: 100px 1fr;
        row-gap: 12px;
        margin: 0;
        font-size: 13px;
      }
      .definition dt {
        color: var(--muted-foreground);
      }
      .definition dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .separator {
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }
      .preview-group {
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .preview-group:first-child {
        padding-top: 0;
      }
      .preview-group p {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .preview-group .keep-line {
        color: var(--primary);
      }
      .confirm-label {
        display: flex;
        gap: 12px;
        align-items: start;
        padding: 12px 0;
        min-height: 44px;
        cursor: pointer;
        font-size: 13px;
      }
      .confirm-label input {
        height: 18px;
        width: 18px;
        margin: 2px 0 0;
        flex-shrink: 0;
      }
      .text-input {
        min-height: 44px;
        width: 100%;
        border: 1px solid var(--input);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--foreground);
        background: var(--background);
        margin-top: 8px;
      }
      .file-path {
        font:
          12px/1.65 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        padding: 12px;
        background: var(--muted);
        border-radius: 8px;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        z-index: 80;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        border-radius: 12px;
        padding: 14px 18px;
        background: var(--foreground);
        color: var(--background);
        box-shadow: 0 8px 30px rgb(0 0 0/0.16);
        font-size: 13px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 700px) {
        .prototype-toolbar {
          padding: 8px 16px;
          align-items: start;
          gap: 8px;
        }
        .prototype-toolbar .prototype-note {
          max-width: 160px;
          padding-top: 5px;
          line-height: 1.6;
        }
        .prototype-controls {
          gap: 2px;
        }
        .prototype-controls label {
          display: none;
        }
        .prototype-controls select {
          min-width: 100px;
          max-width: 116px;
          font-size: 12px;
        }
        .app-nav {
          height: 56px;
          padding: 0 16px;
        }
        .nav-items {
          display: none;
        }
        .brand {
          font-size: 17px;
        }
        main {
          padding: 14px 16px calc(188px + var(--safe));
        }
        .page-heading {
          align-items: center;
          padding: 4px 0 20px;
          gap: 6px;
        }
        h1 {
          font-size: 22px;
          line-height: 30px;
        }
        .head-copy {
          font-size: 12px;
        }
        .page-actions .primary {
          padding: 10px 12px;
        }
        .page-actions .primary .icon {
          display: none;
        }
        .tabs {
          gap: 24px;
        }
        .results-toolbar {
          margin-top: 16px;
          align-items: center;
          gap: 4px;
        }
        .results-toolbar p {
          font-size: 12px;
        }
        .results-toolbar .btn {
          padding: 10px 6px;
          font-size: 12px;
        }
        .group {
          padding: 10px 0 14px;
        }
        .group.selected {
          margin: 0 -8px;
          padding-left: 8px;
          padding-right: 8px;
        }
        .group-head {
          flex-wrap: wrap;
          gap: 0;
        }
        .group-title {
          width: 100%;
          gap: 4px;
        }
        .group-title h2 {
          font-size: 15px;
        }
        .group-head-right {
          width: 100%;
          padding-left: 48px;
          justify-content: space-between;
          gap: 4px;
        }
        .group-head-right .btn {
          padding: 6px 8px;
        }
        .group-note {
          margin-left: 48px;
        }
        .member {
          grid-template-columns: 36px 40px minmax(0, 1fr);
          gap: 8px;
          padding: 8px 0;
          min-height: 72px;
        }
        .keep-label {
          min-width: 36px;
          width: 36px;
          min-height: 48px;
        }
        .keep-label::before {

    </style>

  <body>
    <div class="prototype-toolbar">
      <div class="prototype-note"><strong>交互原型</strong><br />示例数据，不修改图库</div>
      <div class="prototype-controls">
        <label for="scenario">查看状态</label
        ><select id="scenario" aria-label="原型场景">
          <option value="results">检查结果</option>
          <option value="initial">还未检查</option>
          <option value="empty">没有重复</option>
          <option value="loading">加载中</option>
          <option value="running">检查中</option>
          <option value="paused">已暂停</option>
          <option value="failed">检查失败</option>
          <option value="review">需要审核</option>
          <option value="stale">结果过期</option>
          <option value="preparing">清单准备中</option>
          <option value="prepare-failed">清单准备失败</option>
          <option value="plan-stale">清单过期</option>
          <option value="isolated">已隔离</option>
          <option value="conflict">恢复冲突</option>
          <option value="recovery-required">隔离失败</option>
          <option value="restore-failed">恢复失败</option>
          <option value="purge-failed">清理部分失败</option>
          <option value="keeper-changed">保留作品已变化</option></select
        ><button id="theme" class="btn icon-only" aria-label="切换深色外观"></button>
      </div>
    </div>
    <header class="app-nav">
      <div class="brand"><span data-icon="library"></span>PixiShelf</div>
      <nav class="nav-items" aria-label="应用位置示意">
        <span>作品</span><span>艺术家</span><span class="active">管理中心</span>
      </nav>
      <span class="muted small">本地图库</span>
    </header>
    <main>
      <button class="back-link" data-action="back"><span data-icon="left"></span>青山</button>
      <header class="page-heading">
        <div>
          <h1>检查重复</h1>
          <p class="head-copy">青山的作品</p>
        </div>
        <div class="page-actions">
          <button class="btn primary" id="start" data-action="start">
            <span data-icon="scan"></span><span id="start-label">重新检查</span>
          </button>
          <details class="menu-wrap">
            <summary class="btn icon-only" aria-label="检查选项"><span data-icon="more"></span></summary>
            <div class="menu">
              <button class="btn" data-action="full-scan">完整检查</button><small>重新读取原文件，不使用缓存</small>
            </div>
          </details>
        </div>
      </header>
      <div class="tabs" role="tablist" aria-label="去重页面">
        <button
          class="tab"
          role="tab"
          id="results-tab"
          aria-controls="panel"
          aria-selected="true"
          data-action="tab-results"
        >
          检查结果 <span class="tab-count">3</span></button
        ><button
          class="tab"
          role="tab"
          id="isolated-tab"
          aria-controls="panel"
          aria-selected="false"
          tabindex="-1"
          data-action="tab-isolated"
        >
          隔离区 <span class="tab-count" id="isolation-count">1</span>
        </button>
      </div>
      <div id="panel" role="tabpanel" aria-labelledby="results-tab"></div>
    </main>
    <div class="selection-bar" id="selection-bar" hidden>
      <div>
        <p id="selection-title"></p>
        <p class="small muted">保留作品不会移动</p>
      </div>
      <div class="selection-bar-actions">
        <button class="btn" data-action="clear" aria-label="清除选择">
          <span data-icon="x"></span><span class="clear-label">清除选择</span></button
        ><button class="btn primary" data-action="preview">预览隔离</button>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="手机导航示意">
      <span><span data-icon="library"></span>作品</span><span><span data-icon="artists"></span>艺术家</span
      ><span class="active"><span data-icon="more"></span>更多</span>
    </nav>
    <dialog id="detail-dialog" aria-labelledby="sheet-title"></dialog>
    <div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
    <span class="sr-only" role="status" aria-live="polite" id="live-region"></span>
    <script>
      const paths = {
        left: '<path d="m15 18-6-6 6-6"/>',
        right: '<path d="m9 18 6-6-6-6"/>',
        x: '<path d="m6 6 12 12M6 18 18 6"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
        scan: '<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10"/>',
        library: '<rect x="4" y="3" width="14" height="18" rx="2"/><path d="M8 3v18m4-13h3m-3 4h3"/>',
        artists:
          '<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m2-17a3 3 0 0 1 0 6m2 5a6 6 0 0 1 2 4v2"/>',
        archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8m-10 4h6"/>',
        restore: '<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6m3-3v5l3 2"/>',
        alert: '<path d="m12 3 10 18H2L12 3Zm0 6v4m0 4h.01"/>',
        pause: '<path d="M8 5v14m8-14v14"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',
        moon: '<path d="M21 12.8A9 9 0 0 1 11.2 3 9 9 0 1 0 21 12.8Z"/>'
      }
      const icon = (name) =>
        `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.library}</svg>`
      function paintIcons(root = document) {
        root.querySelectorAll('[data-icon]').forEach((node) => (node.innerHTML = icon(node.dataset.icon)))
      }
      const groups = [
        {
          id: 'rain',
          title: '雨后的沿街散步',
          count: 500,
          cover: 'rain',
          symbol: '雨',
          recommended: true,
          members: [
            { id: 'rain-1', title: '雨后的沿街散步', source: 'Pixiv', date: '2025/08/12', mark: '最近读过' },
            { id: 'rain-2', title: '雨后的沿街散步 副本', source: '本地导入', date: '2026/10/20', mark: '' },
            { id: 'rain-3', title: '雨后的沿街散步 备份', source: '本地导入', date: '2026/10/22', mark: '' }
          ]
        },
        {
          id: 'summer',
          title: '夏日写生',
          count: 128,
          cover: 'summer',
          symbol: '夏',
          recommended: false,
          members: [
            { id: 'summer-1', title: '夏日写生', source: 'Pixiv', date: '2025/07/02', mark: '喜欢 3 张' },
            { id: 'summer-2', title: '夏日写生 备份', source: '本地导入', date: '2026/10/19', mark: '评分 4' },
            { id: 'summer-3', title: '夏日写生 重复导入', source: '本地导入', date: '2026/10/22', mark: '' },
            { id: 'summer-4', title: '夏日写生 收藏', source: '来源未知', date: '2026/10/22', mark: '还有整理记录' }
          ]
        },
        {
          id: 'train',
          title: '夜行列车',
          count: 76,
          cover: 'train',
          symbol: '夜',
          recommended: true,
          members: [
            { id: 'train-1', title: '夜行列车', source: 'Pixiv', date: '2025/11/08', mark: '书签 1 张' },
            { id: 'train-2', title: '夜行列车 副本', source: '本地导入', date: '2026/10/22', mark: '' }
          ]
        }
      ]
      const state = {
        scenario: 'results',
        tab: 'results',
        page: 1,
        keepers: { rain: 'rain-1', summer: null, train: 'train-1' },
        selected: new Set(),
        memberPage: 1,
        sheetGroup: null,
        operationStatus: 'ISOLATED',
        operationVersion: 1,
        originalAction: 'ISOLATE',
        purgeAuthorization: null,
        purgeReceipts: new Set(),
        retryPrecheck: { status: 'NOT_CHECKED', version: null },
        retrySnapshot: null,
        purgePrecheck: { status: 'NOT_CHECKED', version: null },
        purgeTimer: null,
        keeperEvidence: 'MATCH',
        manifestEvidence: 'MATCH',
        operationCount: 2,
        batchGroups: [
          {
            title: '雨后的沿街散步',
            keeper: '雨后的沿街散步',
            count: 500,
            losers: ['雨后的沿街散步 副本', '雨后的沿街散步 备份']
          }
        ],
        planStatus: null,
        planTimer: null,
        planRevision: null,
        recoveryConfirmation: null,
        reimportSources: new Set(),
        toastTimer: null,
        lastFocus: null,
        lastFocusKey: null
      }
      const $ = (id) => document.getElementById(id)
      const groupById = (id) => groups.find((group) => group.id === id)
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        )
      function cover(group) {
        return `<div class="cover ${group.cover}" role="img" aria-label="合成占位封面"><span>${group.symbol}</span></div>`
      }
      function member(group, item, inSheet = false) {
        const selected = state.keepers[group.id] === item.id
        return `<li class="member"><label class="keep-label" title="保留${escape(item.title)}"><input type="radio" name="${inSheet ? 'sheet-' : ''}keeper-${group.id}" value="${item.id}" data-group="${group.id}" data-kind="keeper" ${selected ? 'checked' : ''} aria-label="保留${escape(item.title)}" /></label>${cover(group)}<div><div class="member-title" title="${escape(item.title)}">${escape(item.title)}</div><div class="member-meta"><span>${item.source}</span><span>${item.date} 导入</span>${item.mark ? `<span>${item.mark}</span>` : ''}</div></div><div class="member-status">${selected ? `<span class="keep-status">${icon('check')}${group.recommended && item.id === group.members[0].id ? '推荐保留' : '保留这部'}</span>` : ''}</div></li>`
      }
      function groupRow(group) {
        const chosen = state.selected.has(group.id)
        return `<section class="group ${chosen ? 'selected' : ''}" aria-labelledby="group-${group.id}"><header class="group-head"><div class="group-title"><label class="select-label" title="${state.keepers[group.id] ? '选择本组副本' : '请先选择保留作品'}"><input type="checkbox" data-kind="select" data-group="${group.id}" ${chosen ? 'checked' : ''} ${!state.keepers[group.id] || state.scenario === 'stale' ? 'disabled' : ''} aria-label="选择${escape(group.title)}的副本" /></label><h2 id="group-${group.id}">${group.title}</h2></div><div class="group-head-right"><span class="small muted num">${group.members.length} 部 · 每部 ${group.count} 张</span><button class="btn link" data-action="details" data-group="${group.id}">查看差异 ${icon('right')}</button></div></header>${!state.keepers[group.id] ? '<p class="group-note">有多份整理记录，请先选保留项</p>' : ''}<ul class="members" role="radiogroup" aria-label="${group.title}保留作品">${group.members
          .slice(0, 3)
          .map((item) => member(group, item))
          .join(
            ''
          )}</ul>${group.members.length > 3 ? `<div class="member-more"><button class="btn link" data-action="details" data-group="${group.id}">查看全部 ${group.members.length} 部 ${icon('right')}</button></div>` : ''}</section>`
      }
      function empty(title, description, action = '') {
        return `<div class="empty-state"><div class="empty-icon">${icon('scan')}</div><h2>${title}</h2><p>${description}</p>${action}</div>`
      }
      function statusNotice() {
        const current = state.scenario
        if (current === 'running' || current === 'paused') {
          return `<section class="notice" aria-label="检测进度">${icon(current === 'running' ? 'scan' : 'pause')}<div class="notice-body"><strong>${current === 'running' ? '正在检查' : '检查已暂停'} <span class="num">320 / 1,000</span> 部</strong><p>${current === 'running' ? '处理完成后会更新结果' : '继续时会接着处理未完成的作品'}</p><div class="progress-track" role="progressbar" aria-label="检查进度" aria-valuenow="32" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="notice-actions"><button class="btn" data-action="${current === 'running' ? 'pause' : 'resume'}">${current === 'running' ? '暂停' : '继续'}</button><button class="btn" data-action="cancel">取消</button></div></section>`
        }
        if (current === 'failed') {
          return `<section class="notice">${icon('alert')}<div class="notice-body"><strong>检查中断</strong><p>媒体目录暂时无法读取。连接恢复后可重试。</p><details><summary>查看诊断</summary><pre>示例诊断：SOURCE_UNAVAILABLE\n已保存进度：320 / 1,000 部\n完整文件缓存可以复用。</pre></details></div><button class="btn outline" data-action="start">重试</button></section>`
        }
        if (current === 'stale') {
          return `<section class="notice">${icon('alert')}<div class="notice-body"><strong>作品已变化，请重新检查</strong><p>这份结果暂时不能用于隔离。</p></div></section>`
        }
        return ''
      }
      function results() {
        const scenario = state.scenario
        let html = statusNotice()
        if (scenario === 'initial')
          return empty(
            '还未检查',
            '检查青山作品中的相同内容。',
            '<button class="btn primary" data-action="start">开始检查</button>'
          )
        if (scenario === 'empty') return empty('没有找到重复作品', '已检查 1,000 部作品。')
        if (scenario === 'loading')
          return `<div aria-busy="true" aria-label="正在加载检查结果">${[0, 1].map(() => '<div class="skeleton-group"><div class="skeleton"></div>' + [0, 1, 2].map(() => '<div class="skeleton-line"><div class="skeleton-cover"></div><div class="skeleton"></div></div>').join('') + '</div>').join('')}</div>`
        if (['running', 'paused', 'failed'].includes(scenario))
          return html + empty('结果将在检查后显示', '离开页面不会打断后台任务。')
        const visible = scenario === 'review' ? [groups[1]] : groups.slice((state.page - 1) * 2, state.page * 2)
        html += `<div class="results-toolbar"><p>${scenario === 'review' ? '1 组需要选择保留作品' : '3 组内容相同'}</p><button class="btn link" data-action="select-all" ${scenario === 'stale' ? 'disabled' : ''}>选择全部推荐（2 组）</button></div>${visible.map(groupRow).join('')}`
        if (scenario !== 'review')
          html += `<nav class="pagination" aria-label="重复组分页"><button class="btn icon-only outline" data-action="prev" aria-label="上一页" ${state.page === 1 ? 'disabled' : ''}>${icon('left')}</button><span class="num">${state.page} / 2</span><button class="btn icon-only outline" data-action="next" aria-label="下一页" ${state.page === 2 ? 'disabled' : ''}>${icon('right')}</button></nav>`
        return html
      }
      function isolated() {
        if (state.operationStatus === 'RESTORED') return empty('已恢复原位置', '这个批次的作品已回到图库。')
        if (state.operationStatus === 'PURGED')
          return `<div class="results-toolbar"><p>已完成的操作</p></div><article class="isolation-row"><div><div class="batch-title">${icon('archive')}<h2>青山 · ${state.operationCount} 部作品</h2><span class="batch-status">已永久清理</span></div><p class="batch-meta">${state.reimportSources.size ? `已允许 ${state.reimportSources.size} 个来源重新导入 · 文件未恢复` : '文件已删除，来源保持抑制'}</p></div><button class="btn outline" data-action="purged-details">详情</button></article>`
        const recovery = needsRecovery()
        const caption = recovery ? recoverySummary() : '保留至手动清理'
        return `<div class="results-toolbar"><p>${caption}</p></div><article class="isolation-row"><div><div class="batch-title">${icon('archive')}<h2>青山 · ${state.operationCount} 部作品</h2><span class="batch-status ${recovery ? 'warning' : ''}">${recovery ? recoveryTitle() : '已隔离'}</span></div><p class="batch-meta">10 月 23 日 15:42${recovery ? ' · ' + recoverySummary() : ''}</p></div><div class="batch-actions"><button class="btn" data-action="batch-details">详情</button>${recovery ? `<button class="btn outline" data-action="retry-operation">${recoveryActionLabel()}</button>` : canRestore() ? `<button class="btn outline" data-action="restore">${icon('restore')}恢复</button>` : ''}</div></article>`
      }

      function render() {
        const isolatedTab = state.tab === 'isolated'
        $('results-tab').setAttribute('aria-selected', String(!isolatedTab))
        $('results-tab').tabIndex = isolatedTab ? -1 : 0
        $('isolated-tab').setAttribute('aria-selected', String(isolatedTab))
        $('isolated-tab').tabIndex = isolatedTab ? 0 : -1
        $('panel').setAttribute('aria-labelledby', isolatedTab ? 'isolated-tab' : 'results-tab')
        $('panel').innerHTML = isolatedTab ? isolated() : results()
        $('isolation-count').textContent = ['PURGED', 'RESTORED'].includes(state.operationStatus) ? '0' : '1'
        $('start').disabled = ['running', 'loading'].includes(state.scenario)
        $('start-label').textContent = state.scenario === 'initial' ? '开始检查' : '重新检查'
        $('scenario').value = state.scenario
        updateSelection()
        paintIcons()
      }
      function updateSelection() {
        const count = [...state.selected].reduce((sum, id) => sum + groupById(id).members.length - 1, 0)
        $('selection-bar').hidden =
          state.tab !== 'results' ||
          !state.selected.size ||
          ['running', 'paused', 'failed', 'loading', 'initial', 'empty', 'stale'].includes(state.scenario)
        $('selection-title').textContent = `已选 ${state.selected.size} 组 · ${count} 部副本`
      }
      function announce(message) {
        $('live-region').textContent = message
      }
      function toast(message) {
        clearTimeout(state.toastTimer)
        $('toast').textContent = message
        $('toast').hidden = false
        state.toastTimer = setTimeout(() => ($('toast').hidden = true), 3500)
      }
      function changeScenario(scenario) {
        clearTimeout(state.planTimer)
        clearTimeout(state.purgeTimer)
        state.purgePrecheck = { status: 'NOT_CHECKED', version: null }
        state.retryPrecheck = { status: 'NOT_CHECKED', version: null }
        state.retrySnapshot = null
        state.planStatus = null
        state.planRevision = null
        state.recoveryConfirmation = null
        state.scenario = scenario
        state.page = 1
        state.selected.clear()
        const operationScenarios = [
          'isolated',
          'conflict',
          'recovery-required',
          'restore-failed',
          'purge-failed',
          'keeper-changed'
        ]
        state.tab = operationScenarios.includes(scenario) ? 'isolated' : 'results'
        if (operationScenarios.includes(scenario)) {
          state.operationStatus = ['conflict', 'recovery-required', 'restore-failed', 'purge-failed'].includes(scenario)
            ? 'RECOVERY_REQUIRED'
            : 'ISOLATED'
          state.originalAction =
            scenario === 'purge-failed'
              ? 'PURGE'
              : ['conflict', 'restore-failed'].includes(scenario)
                ? 'RESTORE'
                : 'ISOLATE'
          state.operationVersion += 1
          state.keeperEvidence = scenario === 'keeper-changed' ? 'CHANGED' : 'MATCH'
          state.manifestEvidence = 'MATCH'
          state.purgeReceipts.clear()
          state.purgeAuthorization =

            element.tabIndex >= 0 &&
            !element.matches(':disabled') &&
            !element.closest('[hidden], [inert]') &&
            element.getClientRects().length > 0 &&
            getComputedStyle(element).visibility !== 'hidden'
        )
        const tabbables = visible.filter((element) => {
          if (element.type !== 'radio' || !element.name) return true
          const group = visible.filter((other) => other.type === 'radio' && other.name === element.name)
          return element === (group.find((other) => other.checked) || group[0])
        })
        const first = tabbables[0],
          last = tabbables[tabbables.length - 1],
          active = document.activeElement
        if (!first) {
          event.preventDefault()
          $('sheet-title').focus()
          return
        }
        if (!tabbables.includes(active) || (event.shiftKey ? active === first : active === last)) {
          event.preventDefault()
          ;(event.shiftKey ? last : first).focus()
        }
      }
      function close() {
        if ($('detail-dialog').open) $('detail-dialog').close()
      }
      document.addEventListener('click', (event) => {
        const node = event.target.closest('[data-action]')
        if (!node || node.disabled) return
        const action = node.dataset.action
        if (action === 'back') {
          toast('原型：返回艺术家页')
          return
        }
        if (action === 'tab-results' || action === 'tab-isolated') {
          clearTimeout(state.planTimer)
          state.tab = action === 'tab-results' ? 'results' : 'isolated'
          render()
          return
        }
        if (action === 'start' || action === 'full-scan') {
          document.querySelector('.menu-wrap').open = false
          changeScenario('running')
          if (action === 'full-scan') toast('原型：已开始完整检查')
          return
        }
        if (action === 'pause') {
          changeScenario('paused')
          return
        }
        if (action === 'resume') {
          changeScenario('running')
          return
        }
        if (action === 'cancel') {
          changeScenario('initial')
          toast('原型：检查已取消，完整文件缓存保留')
          return
        }
        if (action === 'select-all') {
          state.selected = new Set(groups.filter((group) => group.recommended).map((group) => group.id))
          render()
          announce('已选择全部 2 组推荐，包含未显示页，共 3 部副本')
          toast('已选择全部推荐，包含第 2 页')
          return
        }
        if (action === 'clear') {
          state.selected.clear()
          render()
          return
        }
        if (action === 'prev' || action === 'next') {
          state.page += action === 'next' ? 1 : -1
          render()
          return
        }
        if (action === 'details') {
          showDetails(node.dataset.group)
          return
        }
        if (action === 'member-prev' || action === 'member-next') {
          state.memberPage += action === 'member-next' ? 1 : -1
          showDetails(state.sheetGroup, true)
          return
        }
        if (action === 'preview') {
          preview()
          return
        }
        if (action === 'close') {
          close()
          return
        }
        if (action === 'batch-details') {
          batchDetails()
          return
        }
        if (action === 'recovery-diagnostics') {
          recoveryDiagnostics()
          return
        }
        if (action === 'retry-operation') {
          retryOperation()
          return
        }
        if (action === 'restore') {
          restore()
          return
        }
        if (action === 'purge') {
          purge()
          return
        }
        if (action === 'purged-details') {
          purgedDetails()
          return
        }
        if (action === 'allow-reimport') {
          allowReimport()
          return
        }
        if (action === 'confirm-reimport') {
          $('detail-dialog')
            .querySelectorAll('.reimport-choice:checked')
            .forEach((input) => state.reimportSources.add(input.value))
          close()
          render()
          toast('原型：已允许选中来源重新导入，文件没有恢复')
          return
        }
        if (action === 'rebuild-plan') {
          state.scenario = 'results'
          state.planStatus = 'BUILDING'
          render()
          preview(true)
          return
        }
        if (action === 'confirm-isolate') {
          if (!canConfirmIsolation()) return
          const recoveryConfirmation = {
            planRevision: state.planRevision,
            backupCheckpointRef: $('backup-ref').value.trim(),
            backupCheckpointConfirmed: true,
            externalWritesStopped: true
          }
          state.batchGroups = planSnapshot()
          state.reimportSources.clear()
          state.operationCount = [...state.selected].reduce((sum, id) => sum + groupById(id).members.length - 1, 0)
          close()
          changeScenario('isolated')
          state.recoveryConfirmation = recoveryConfirmation
          toast('原型：副本已隔离，可以恢复')
          return
        }
        if (action === 'confirm-restore') {
          if (!canRestore()) return
          state.originalAction = 'RESTORE'
          state.operationStatus = 'RESTORED'
          close()
          render()
          toast('原型：作品已恢复')
          return
        }
        if (action === 'confirm-retry-operation') {
          const snapshot = state.retrySnapshot
          if (
            !canRetryOperation() ||
            state.originalAction === 'PURGE' ||
            !snapshot ||
            snapshot.version !== state.operationVersion ||
            snapshot.action !== state.originalAction ||
            snapshot.scope !== operationScope()
          )
            return
          if (state.scenario === 'conflict') {
            toast('原型：原位置仍有文件，未覆盖；恢复保持待处理')
            return
          }
          state.operationStatus = state.originalAction === 'RESTORE' ? 'RESTORED' : 'ISOLATED'
          state.operationVersion += 1
          close()
          render()
          toast('原型：原操作已完成')
          return
        }
        if (action === 'confirm-retry-purge') {
          if (!canConfirmRetryPurge()) {
            retryPurge()
            return
          }
          batchItems().forEach((item) => state.purgeReceipts.add(item.id))
          state.purgeAuthorization = {
            operationId: 'batch-001',
            authorizedVersion: state.operationVersion,
            scope: operationScope()
          }
          state.originalAction = 'PURGE'
          batchItems().forEach((item) => state.purgeReceipts.add(item.id))
          state.operationStatus = 'PURGED'
          close()
          render()
          toast('原型：原授权清理已完成')
          return
        }
        if (action === 'confirm-purge') {
          if (!canConfirmPurge()) {
            purge()
            return
          }
          state.purgeAuthorization = {
            operationId: 'batch-001',
            authorizedVersion: state.operationVersion,
            scope: operationScope()
          }
          state.originalAction = 'PURGE'
          batchItems().forEach((item) => state.purgeReceipts.add(item.id))
          state.operationStatus = 'PURGED'
          close()
          render()
          toast('原型：副本已永久删除')
          return
        }
      })
      document.addEventListener('change', (event) => {
        const node = event.target
        if (node.id === 'scenario') {
          close()
          changeScenario(node.value)
          return
        }
        if (node.dataset.kind === 'select') {
          node.checked ? state.selected.add(node.dataset.group) : state.selected.delete(node.dataset.group)
          render()
          document.querySelector(`[data-kind="select"][data-group="${node.dataset.group}"]`)?.focus()
          return
        }
        if (node.dataset.kind === 'keeper') {
          state.keepers[node.dataset.group] = node.value
          render()
          if ($('detail-dialog').open) {
            showDetails(node.dataset.group, true)
            $('detail-dialog').querySelector(`[value="${node.value}"]`)?.focus()
          } else document.querySelector(`[value="${node.value}"]`)?.focus()
          announce('保留选择已更新；隔离范围没有改变')
          return
        }
        if (node.classList.contains('reimport-choice')) {
          $('confirm-reimport').disabled = !$('detail-dialog').querySelector('.reimport-choice:checked:not(:disabled)')
          return
        }
        if (['external-confirm', 'personal-confirm', 'backup-confirm'].includes(node.id)) {
          $('confirm-isolate').disabled = !canConfirmIsolation()
        }
      })
      document.addEventListener('input', (event) => {
        if (event.target.id === 'backup-ref') $('confirm-isolate').disabled = !canConfirmIsolation()
      })
      document.querySelector('.tabs').addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return
        event.preventDefault()
        state.tab =
          event.key === 'Home'
            ? 'results'
            : event.key === 'End'
              ? 'isolated'
              : state.tab === 'results'
                ? 'isolated'
                : 'results'
        render()
        $(state.tab === 'results' ? 'results-tab' : 'isolated-tab').focus()
      })
      $('detail-dialog').addEventListener('keydown', trapDialogTab)
      $('detail-dialog').addEventListener('close', () => {
        if (state.lastFocus?.isConnected) {
          state.lastFocus.focus()
          return
        }
        const key = state.lastFocusKey
        const match = key?.action
          ? document.querySelector(`[data-action="${key.action}"]${key.group ? `[data-group="${key.group}"]` : ''}`)
          : null
        ;(match || $(state.tab === 'results' ? 'results-tab' : 'isolated-tab')).focus()
      })
      $('theme').addEventListener('click', () => {
        const dark = document.documentElement.dataset.theme !== 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        $('theme').innerHTML = icon(dark ? 'sun' : 'moon')
        $('theme').setAttribute('aria-label', dark ? '切换浅色外观' : '切换深色外观')
      })
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'
      $('theme').innerHTML = icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon')
      const initial = new URLSearchParams(location.search).get('state')
      if (initial && [...$('scenario').options].some((option) => option.value === initial)) changeScenario(initial)
      else render()
    </script>
  </body>
</html>
